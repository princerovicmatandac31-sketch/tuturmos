<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tuturmus – Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      background:#14101e;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:'Outfit',sans-serif;
    }
    .auth-card{
      background:rgba(108,102,130,0.82);
      backdrop-filter:blur(16px);
      border-radius:22px;
      padding:52px 44px 44px;
      width:440px;
      display:flex;
      flex-direction:column;
      gap:14px;
      box-shadow:0 32px 80px rgba(0,0,0,0.5);
    }
    .logo-wrap{display:flex;justify-content:center;margin-bottom:20px;}
    .logo-svg{width:72px;height:72px;}
    .form-group{display:flex;flex-direction:column;gap:0;}
    .form-group label{
      font-size:12px;font-weight:600;color:#1a1630;
      padding:10px 14px 0;
      background:rgba(242,238,255,0.93);
      border-radius:10px 10px 0 0;
      letter-spacing:0.02em;
    }
    .form-group input{
      background:rgba(242,238,255,0.93);
      border:none;border-radius:0 0 10px 10px;
      padding:8px 14px 12px;font-size:14px;
      font-family:'Outfit',sans-serif;color:#333;outline:none;width:100%;
    }
    .form-group input::placeholder{color:#aaa;}
    .btn-primary{
      background:#7b68c8;color:#fff;border:none;border-radius:10px;
      padding:15px;font-size:16px;font-family:'Outfit',sans-serif;font-weight:500;
      cursor:pointer;margin-top:6px;transition:background 0.2s,transform 0.1s;
    }
    .btn-primary:hover{background:#6a58b8;}
    .btn-primary:active{transform:scale(0.98);}
    .switch-link{text-align:center;font-size:13px;color:#fff;margin-top:2px;}
    .switch-link a{color:#fff;text-decoration:none;}
    .switch-link a:hover{text-decoration:underline;}
    .error-msg{
      color:#ff6b6b;font-size:13px;text-align:center;display:none;
      background:rgba(255,107,107,0.12);border-radius:8px;padding:8px;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="logo-wrap">
      <svg class="logo-svg" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
        <text x="2" y="52" font-family="Arial Black,sans-serif" font-weight="900" font-size="48" fill="#1a1630">T</text>
        <text x="33" y="52" font-family="Arial Black,sans-serif" font-weight="900" font-size="48" fill="#1a1630">J</text>
        <circle cx="58" cy="55" r="5" fill="#1a1630"/>
        <rect x="62" y="35" width="4" height="20" rx="2" fill="#1a1630"/>
        <rect x="62" y="35" width="14" height="4" rx="2" fill="#1a1630"/>
      </svg>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="reg-email" placeholder="yuridanieltanaleon@gmail.com"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="reg-password" placeholder="Password"/>
    </div>
    <div class="form-group">
      <label>Re-enter Password</label>
      <input type="password" id="reg-password2" placeholder="Re-enter Password" onkeydown="if(event.key==='Enter')doRegister()"/>
    </div>
    <div class="error-msg" id="err"></div>
    <button class="btn-primary" onclick="doRegister()">Sign in</button>
    <p class="switch-link"><a href="index.html">Already have an account? Login</a></p>
  </div>
  <script>
    function doRegister(){
      const email=document.getElementById('reg-email').value.trim();
      const pw1=document.getElementById('reg-password').value;
      const pw2=document.getElementById('reg-password2').value;
      const err=document.getElementById('err');
      if(!email||!pw1){err.textContent='Please fill in all fields.';err.style.display='block';return;}
      if(pw1!==pw2){err.textContent='Passwords do not match.';err.style.display='block';return;}
      const users=JSON.parse(localStorage.getItem('tt_users')||'[]');
      if(users.find(u=>u.email===email)){err.textContent='Email already registered.';err.style.display='block';return;}
      const username=email.split('@')[0];
      const user={
        email,password:pw1,username,bio:'',
        avatar:'',
        joined:new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}),
        playlists:[]
      };
      users.push(user);
      localStorage.setItem('tt_users',JSON.stringify(users));
      localStorage.setItem('tt_current',JSON.stringify(user));
      window.location.href='app.html';
    }
  </script>
</body>
</html>
