<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tuturmus – Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="auth-page">
    <div class="auth-card">
      <div class="logo-wrap">
        <svg
          class="logo-svg"
          viewBox="0 0 72 72"
          xmlns="http://www.w3.org/2000/svg"
        >
          <text
            x="10"
            y="56"
            font-family="Arial Black,sans-serif"
            font-weight="900"
            font-size="58"
            fill="#1a1630"
          >
            T
          </text>
        </svg>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="user@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="Password" />
      </div>
      <div class="form-group">
        <label>Re-enter Password</label>
        <input
          type="password"
          id="reg-password2"
          placeholder="Re-enter Password"
          onkeydown="if (event.key === 'Enter') doRegister();"
        />
      </div>
      <div class="error-msg" id="err"></div>
      <button class="btn-primary" onclick="doRegister()">Register</button>
      <p class="switch-link">
        <a href="admin.html">Already have an account? Login</a>
      </p>
    </div>
    <script>
      function doRegister() {
        const email = document.getElementById("reg-email").value.trim();
        const pw1 = document.getElementById("reg-password").value;
        const pw2 = document.getElementById("reg-password2").value;
        const err = document.getElementById("err");
        if (!email || !pw1) {
          err.textContent = "Please fill in all fields.";
          err.style.display = "block";
          return;
        }
        if (pw1 !== pw2) {
          err.textContent = "Passwords do not match.";
          err.style.display = "block";
          return;
        }
        const users = JSON.parse(localStorage.getItem("tt_users") || "[]");
        if (users.find((u) => u.email === email)) {
          err.textContent = "Email already registered.";
          err.style.display = "block";
          return;
        }
        const username = email.split("@")[0];
        const user = {
          email,
          password: pw1,
          username,
          bio: "",
          avatar: "",
          joined: new Date().toLocaleDateString("en-US", {
            year: "numeric",
            month: "long",
            day: "numeric",
          }),
          playlists: [],
        };
        users.push(user);
        localStorage.setItem("tt_users", JSON.stringify(users));
        localStorage.setItem("tt_current", JSON.stringify(user));
        window.location.href = "app.html";
      }
    </script>
  </body>
</html>
