<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tuturmus – Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="auth-page">
    <div class="auth-card">
      <div class="logo-wrap">
        <svg
          class="logo-svg"
          viewBox="0 0 72 72"
          xmlns="http://www.w3.org/2000/svg"
        >
          <text
            x="10"
            y="56"
            font-family="Arial Black,sans-serif"
            font-weight="900"
            font-size="58"
            fill="#1a1630"
          >
            T
          </text>
        </svg>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="user@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          id="login-password"
          placeholder="Password"
          onkeydown="if (event.key === 'Enter') doLogin();"
        />
      </div>
      <div class="error-msg" id="err">
        Invalid credentials. Please register first.
      </div>
      <button class="btn-primary" onclick="doLogin()">Login</button>
      <p class="switch-link">
        <a href="register.html">Don't have an account? Register</a>
      </p>
    </div>
    <script>
      function doLogin() {
        const email = document.getElementById("login-email").value.trim();
        const password = document.getElementById("login-password").value;
        const err = document.getElementById("err");
        if (!email || !password) {
          err.textContent = "Please fill in all fields.";
          err.style.display = "block";
          return;
        }
        const users = JSON.parse(localStorage.getItem("tt_users") || "[]");
        const match = users.find(
          (u) => u.email === email && u.password === password,
        );
        if (match) {
          localStorage.setItem("tt_current", JSON.stringify(match));
          window.location.href = "app.html";
        } else {
          err.textContent = "Invalid credentials. Please register first.";
          err.style.display = "block";
        }
      }
    </script>
  </body>
</html>
